aid: cadence-neuroscience
name: Cadence Neuroscience
description: 'Cadence Neuroscience, Inc. is a clinical-stage medical device company founded in 2017 and
  headquartered in Redmond, Washington, developing a personalized neuromodulation system for pediatric
  and adult patients with focal drug-resistant epilepsy. Its implantable system, licensed from Mayo Clinic
  and incubated by a Mayo Clinic Rochester neurology and neurosurgery team, delivers chronic subthreshold
  cortical stimulation and detects EEG biomarkers of epileptiform activity in order to reduce or eliminate
  seizures. The company raised a $15M Series A in 2019 and a $26M Series B in 2023 led by the Angelini Lumira
  Biosciences Fund, with participation from F-Prime Capital, LivaNova USA, Angelini Ventures, Spectrum
  Financial Services and Mayo Clinic, and is using the proceeds to complete pivotal clinical studies and
  pursue FDA clearance. It is a regulated medical device manufacturer rather than a software vendor: it
  publishes no developer portal, public API, SDK or machine-readable API contract.'
